# Hulpje voor Claude: haalt bestanden op die Claude zelf niet kan downloaden
# (Unsplash-foto's, ElevenLabs-voice-overs) en zet ze in deze repo.
# Gebruik: zet een .txt in fetch-queue/ met per regel: <doelpad> <url>
name: Media ophalen
on:
  push:
    paths: ['fetch-queue/*.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-media
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bestanden
        run: |
          shopt -s nullglob
          for q in fetch-queue/*.txt; do
            while read -r dest url; do
              [ -z "$dest" ] && continue
              case "$dest" in /*|*..*) echo "Ongeldig pad: $dest"; continue;; esac
              mkdir -p "$(dirname "$dest")"
              curl -fsSL --retry 3 -o "$dest" "$url" && echo "OK $dest" || echo "MISLUKT $dest"
            done < "$q"
            git rm -q "$q"
          done
      - name: Opslaan
        run: |
          git config user.name "wayfare-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Media opgehaald door hulpje"
          git push
