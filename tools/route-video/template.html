function legSlice(l,p){const d=p*l.len,r=[l.pts[0]];for(let i=1;i<l.pts.length;i++){if(l.cum[i]<d)r.push(l.pts[i]);else{r.push(legAt(l,p));break;}}return r;}

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eback=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};

function P(ll){const dx=(ll[0]-CAM.lon)*COSL*CAM.zoom,dy=-(ll[1]-CAM.lat)*CAM.zoom;const t=CAM.tilt*Math.PI/180;const y1=dy*Math.cos(t),z=Math.max(-dy*Math.sin(t),-0.6*F);const s=F/(F+z);return [W/2+dx*s,CAM.cy+y1*s,s];}
function smoothPath(pts,closed){const p=pts.map(P);ctx.beginPath();if(closed){const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(p[p.length-1],p[0]);ctx.moveTo(s[0],s[1]);for(let i=0;i<p.length;i++){const n=p[(i+1)%p.length],mm=m(p[i],n);ctx.quadraticCurveTo(p[i][0],p[i][1],mm[0],mm[1]);}ctx.closePath();}else{ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mm=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];ctx.quadraticCurveTo(p[i][0],p[i][1],mm[0],mm[1]);}const l=p[p.length-1];ctx.lineTo(l[0],l[1]);}}
function pip(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>pt[1])!=(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
// seeded random

function spaced(txt,x,y,sp,align){ // letter-spaced text

// ---------- camera ----------
function stopCam(i){const s=STOPS[i];return {lon:s.ll[0],lat:s.ll[1],zoom:s.zoom,tilt:40,cy:TT?1235:1270};}

function mix(a,b,t){return {lon:lerp(a.lon,b.lon,t),lat:lerp(a.lat,b.lat,t),zoom:Math.exp(lerp(Math.log(a.zoom),Math.log(b.zoom),t)),tilt:lerp(a.tilt,b.tilt,t),cy:lerp(a.cy,b.cy,t)};}
function camAt(t){
 if(t<T.introEnd){const k=t/T.introEnd;return {...OVER,zoom:OVER.zoom*(1+0.05*k),lat:OVER.lat+0.25*k};}
 if(t<ARR[0]){const k=eio(seg(t,T.introEnd,ARR[0]));const a={...OVER,zoom:OVER.zoom*1.05,lat:OVER.lat+0.25};return mix(a,stopCam(0),k);}

  const a=ARR[i],lv=LV[i];
  if(t<lv||i==STOPS.length-1&&t<OUT0){const c=stopCam(i);const k=seg(t,a,lv);c.zoom*=1+0.06*k;return c;}
  if(i<LEGS.length&&t<ARR[i+1]){const l=LEGS[i];const p=eio(seg(t,lv,ARR[i+1]));const h=legAt(l,p);const A=stopCam(i),B=stopCam(i+1);A.zoom*=1.06;
   const dip=l.fly?0.72:0.35;const z=Math.exp(lerp(Math.log(A.zoom),Math.log(B.zoom),p))*(1-dip*Math.sin(Math.PI*p));
   return {lon:h[0],lat:h[1],zoom:z,tilt:40-(l.fly?14:6)*Math.sin(Math.PI*p),cy:(TT?1235:1270)-230*Math.sin(Math.PI*p)};}
 }
 if(t<OUT1){const A=stopCam(4);A.zoom*=1.06;return mix(A,FINAL,eio(seg(t,OUT0,OUT1)));}

}

 ctx.fillStyle='rgba(243,235,221,0.07)';const ds=clamp(CAM.zoom/160,0.8,3);for(const d of DOTS){const p=P(d);if(p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20)continue;ctx.beginPath();ctx.arc(p[0],p[1],ds*p[2],0,6.283);ctx.fill();}

 // coastline + borders
 ctx.strokeStyle='rgba(243,235,221,0.75)';ctx.lineWidth=clamp(CAM.zoom/60,1.6,4);ctx.lineJoin='round';for(const poly of HL){smoothPath(poly,true);ctx.stroke();}

function plane(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.shadowColor=C.goldL;ctx.shadowBlur=20;ctx.fillStyle=C.cream;ctx.beginPath();

function drawHUD(t){
 // top/bottom gradients
 let g=ctx.createLinearGradient(0,0,0,420);g.addColorStop(0,'rgba(6,24,18,0.85)');g.addColorStop(1,'rgba(6,24,18,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,420);
 g=ctx.createLinearGradient(0,H-560,0,H);g.addColorStop(0,'rgba(6,24,18,0)');g.addColorStop(1,'rgba(6,24,18,0.92)');ctx.fillStyle=g;ctx.fillRect(0,H-560,W,560);
 // wordmark
 {const L=IM.logo,lw=270,lh=lw*L.height/L.width;ctx.drawImage(L,70,256-lh/2,lw,lh);}
 if(!TT){ctx.font='600 20px Body';ctx.fillStyle='rgba(243,235,221,0.75)';ctx.textBaseline='middle';spaced('JAPAN  ·  ROUTE',W-70,256,4,'right');}
 // intro title
 const ia=1-seg(t,T.introEnd-0.3,T.introEnd+0.35);const ii=eout(seg(t,0.15,0.9));
 if(ia>0){ctx.globalAlpha=ia*clamp(seg(t,0.1,0.6));const yy=(1-ii)*40;
  ctx.font='700 22px Body';const lbl='BESTEMMING VAN DE WEEK';const lw=[...lbl].reduce((q,ch)=>q+ctx.measureText(ch).width+4,0)+44;ctx.fillStyle=C.sand;rr(70,350+yy,lw,52,26);ctx.fill();ctx.fillStyle=C.dark;spaced(lbl,70+lw/2,377+yy,4,'center');
  ctx.globalAlpha=ia*clamp(seg(t,0.35,0.95));ctx.fillStyle=C.cream;ctx.font='600 168px Lora';ctx.textBaseline='alphabetic';ctx.fillText('Japan',62,575+yy*1.4);
  ctx.globalAlpha=ia*clamp(seg(t,0.7,1.3));ctx.font='italic 400 44px Lora';ctx.fillStyle=C.sand;ctx.fillText('van de Fuji tot het oude bos',70,650+yy);
  ctx.font='500 32px Body';ctx.fillStyle='rgba(243,235,221,0.85)';ctx.fillText('5 stops, 1 route. Reis je mee?',70,712+yy);ctx.globalAlpha=1;}

  ctx.globalAlpha=1;}
 // finale
 const fa=clamp(seg(t,OUT1-0.5,OUT1+0.4));
 if(fa>0){const yy=(1-eout(fa))*36;ctx.globalAlpha=fa;ctx.textBaseline='alphabetic';
  ctx.font='italic 400 44px Lora';ctx.fillStyle=C.sand;ctx.fillText('± 800 km, 5 stops',70,380+yy);
  ctx.fillStyle=C.cream;ctx.font='600 96px Lora';ctx.fillText('Welke stop',66,490+yy);ctx.fillText('kies jij?',66,590+yy);

  ctx.font='700 30px Body';const cta=REEL?'Download hem via de link in bio':'Meld je aan via de link in bio';const cw2=ctx.measureText(cta).width+80;const by=TT?-375:BY*1.15;ctx.fillStyle=C.gold;rr(70,1600+by+y2,cw2,76,38);ctx.fill();ctx.fillStyle=C.dark;ctx.textBaseline='middle';ctx.fillText(cta,110,1639+by+y2);
  ctx.font='italic 400 30px Lora';ctx.fillStyle=C.sand;ctx.textBaseline='alphabetic';if(!TT)ctx.fillText('live in januari 2027',70,1735+BY*1.15+y2);

function drawSubs(t){
 for(const [a,b,txt] of SUBS){const nb=b+0.25;if(t<a-0.05||t>nb+0.12)continue;
  const al=clamp(seg(t,a-0.05,a+0.1))*(1-seg(t,nb,nb+0.12));if(al<=0)continue;
  ctx.font='600 42px Body';const maxw=820;const words=txt.split(' ');const lines=[];let cur='';
  for(const w of words){const tr=(cur+' '+w).trim();if(ctx.measureText(tr).width>maxw&&cur){lines.push(cur);cur=w;}else cur=tr;}lines.push(cur);
  // balance two lines
  if(lines.length==2){const all=txt.split(' ');let best=null;for(let k=1;k<all.length;k++){const l1=all.slice(0,k).join(' '),l2=all.slice(k).join(' ');const d=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width);if(d<=maxw&&(!best||d<best[0]))best=[d,l1,l2];}if(best){lines[0]=best[1];lines[1]=best[2];}}
  const lh=56,y0=1400-(lines.length-1)*lh/2;ctx.globalAlpha=al;ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((l,i)=>{const w=ctx.measureText(l).width;ctx.fillStyle='rgba(6,24,18,0.55)';rr(W/2-w/2-22,y0+i*lh-28,w+44,56,14);ctx.fill();});
  lines.forEach((l,i)=>{ctx.fillStyle=C.cream;ctx.fillText(l,W/2,y0+i*lh+2);});
  ctx.textAlign='left';ctx.globalAlpha=1;}
}
window.draw=function(t){
 CAM=camAt(t);ctx.save();drawMap(t);drawRoute(t);drawPins(t);ctx.restore();drawCard(t);drawHUD(t);drawSubs(t);
 // vignette + grain
